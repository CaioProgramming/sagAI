<!doctype html><meta charset="utf-8"><title>Base do dragão</title>
<style>
body{margin:0;padding:32px;background:#0b0b0d;color:#e8e6ef;font:15px/1.4 system-ui,sans-serif}
h2{font-weight:600;margin:32px 0 12px} .row{display:flex;gap:18px;flex-wrap:wrap}
figure{margin:0;padding:14px;border-radius:20px;text-align:center} figure img{width:300px;height:300px;display:block}
figcaption{margin-top:8px;font-size:13px;opacity:.75}
.ad{text-align:center} .mask{position:relative;width:200px;height:200px;overflow:hidden;background:#222}
.mask img{position:absolute;inset:0;width:100%;height:100%} .ad span,.sm span{display:block;font-size:13px;opacity:.75;margin-top:6px}
.safe{position:absolute;left:50%;top:50%;width:61%;height:61%;transform:translate(-50%,-50%);border:2px dashed #fff8;border-radius:50%}
.sm{display:flex;align-items:flex-end;gap:16px;margin:0 0 14px} .sm span{width:110px;margin:0}
</style>
<h2>Antigo (referência do usuário) contra a base nova</h2><div class="row"><figure style="background:#000"><img src="reference/old_duo_light.webp" alt="Antigo (Duo), claro"><figcaption>Antigo (Duo), claro</figcaption></figure><figure style="background:#000"><img src="svg/base_light.svg" alt="Base nova, claro"><figcaption>Base nova, claro</figcaption></figure><figure style="background:#000"><img src="reference/old_duo_dark.webp" alt="Antigo (Duo), escuro"><figcaption>Antigo (Duo), escuro</figcaption></figure><figure style="background:#000"><img src="svg/base_dark.svg" alt="Base nova, escuro"><figcaption>Base nova, escuro</figcaption></figure></div>
<h2>Legibilidade em 144, 96, 72 e 48 px</h2><div class="sm"><span>Antigo</span><img src="reference/old_duo_light.webp" width="144" height="144"><img src="reference/old_duo_light.webp" width="96" height="96"><img src="reference/old_duo_light.webp" width="72" height="72"><img src="reference/old_duo_light.webp" width="48" height="48"></div><div class="sm"><span>Base clara</span><img src="svg/base_light.svg" width="144" height="144"><img src="svg/base_light.svg" width="96" height="96"><img src="svg/base_light.svg" width="72" height="72"><img src="svg/base_light.svg" width="48" height="48"></div><div class="sm"><span>Base escura</span><img src="svg/base_dark.svg" width="144" height="144"><img src="svg/base_dark.svg" width="96" height="96"><img src="svg/base_dark.svg" width="72" height="72"><img src="svg/base_dark.svg" width="48" height="48"></div>
<h2>Adaptive icon (tracejado = área segura de 66dp)</h2><div class="row"><div class="ad"><div class="mask" style="border-radius:50%"><img src="svg/base_adaptive_background_light.svg"><img src="svg/base_adaptive_foreground_light.svg"><div class="safe"></div></div><span>círculo</span></div><div class="ad"><div class="mask" style="border-radius:30%"><img src="svg/base_adaptive_background_light.svg"><img src="svg/base_adaptive_foreground_light.svg"><div class="safe"></div></div><span>squircle</span></div><div class="ad"><div class="mask" style="border-radius:10%"><img src="svg/base_adaptive_background_light.svg"><img src="svg/base_adaptive_foreground_light.svg"><div class="safe"></div></div><span>quadrado</span></div><div class="ad"><div class="mask" style="border-radius:50%"><img src="svg/base_adaptive_background_dark.svg"><img src="svg/base_adaptive_foreground_dark.svg"><div class="safe"></div></div><span>escuro</span></div><div class="ad"><div class="mask" style="border-radius:50%;background:#2c2540"><img src="svg/base_adaptive_monochrome.svg" style="filter:invert(1) sepia(1) saturate(3) hue-rotate(220deg) brightness(1.1)"></div><span>temático (mono)</span></div></div>
