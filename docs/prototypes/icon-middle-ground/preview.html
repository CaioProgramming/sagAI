<!doctype html><meta charset="utf-8"><title>Ícone: meio-termo</title>
<style>
body{margin:0;padding:32px;background:#0b0b0d;color:#e8e6ef;font:15px/1.4 system-ui,sans-serif}
h2{font-weight:600;margin:36px 0 12px} .row{display:flex;gap:20px;flex-wrap:wrap}
figure{margin:0;padding:18px;border-radius:20px;text-align:center} figure img{width:240px;height:240px;display:block}
figcaption{margin-top:8px;font-size:13px;opacity:.75}
.ad{text-align:center} .mask{position:relative;width:216px;height:216px;overflow:hidden;background:#222}
.mask img{position:absolute;inset:0;width:100%;height:100%} .ad span,.sm span{display:block;font-size:13px;opacity:.75;margin-top:6px}
.safe{position:absolute;left:50%;top:50%;width:61%;height:61%;transform:translate(-50%,-50%);border:2px dashed #fff8;border-radius:50%}
.sm{display:flex;align-items:flex-end;gap:16px;margin:0 0 16px} .sm span{width:120px;margin:0}
</style>
<h2>Candidatos (tile = rosto)</h2><div class="row"><figure style="background:#000"><img src="svg/A_abobora_dragao.svg" alt="A  Abóbora"><figcaption>A  Abóbora</figcaption></figure><figure style="background:#000"><img src="svg/B_mumia_dragao.svg" alt="B  Múmia"><figcaption>B  Múmia</figcaption></figure><figure style="background:#000"><img src="svg/C_gota_tile.svg" alt="C  Gota em tile"><figcaption>C  Gota em tile</figcaption></figure><figure style="background:#000"><img src="svg/D_abobora_escuro.svg" alt="A no escuro"><figcaption>A no escuro</figcaption></figure></div>
<h2>Prova por gênero (o dragão continua roxo, só o acessório muda)</h2><div class="row"><figure style="background:#000"><img src="svg/E_heroes_mascara.svg" alt="A + Heroes"><figcaption>A + Heroes</figcaption></figure><figure style="background:#000"><img src="svg/F_crime_aviador.svg" alt="A + Crime"><figcaption>A + Crime</figcaption></figure></div>
<h2>Adaptive icon do candidato A (a linha tracejada é a área segura de 66dp)</h2><div class="row"><div class="ad"><div class="mask" style="border-radius:50%"><img src="svg/A_adaptive_background.svg"><img src="svg/A_adaptive_foreground.svg"><div class="safe"></div></div><span>círculo</span></div><div class="ad"><div class="mask" style="border-radius:30%"><img src="svg/A_adaptive_background.svg"><img src="svg/A_adaptive_foreground.svg"><div class="safe"></div></div><span>squircle</span></div><div class="ad"><div class="mask" style="border-radius:10%"><img src="svg/A_adaptive_background.svg"><img src="svg/A_adaptive_foreground.svg"><div class="safe"></div></div><span>quadrado</span></div><div class="ad"><div class="mask mono" style="border-radius:50%;background:#2c2540"><img src="svg/A_adaptive_monochrome.svg" style="filter:invert(1) sepia(1) saturate(3) hue-rotate(220deg) brightness(1.1)"></div><span>temático (mono)</span></div></div>
