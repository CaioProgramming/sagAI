<title>Laboratório de Títulos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Bangers&family=IM+Fell+English+SC&family=Rye&family=Shippori+Mincho:wght@800&family=Syne:wght@800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: genre tabs, one dark stage, compact controls, a two-line note on what the app does today. */
  :root {
    --bg: #0c0807;
    --panel: #17100e;
    --line: #2d1f1a;
    --fg: #f3e6dc;
    --muted: #a08f84;
    --accent: #ff7a1a;
    --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-ui);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    font: inherit; font-weight: 500; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; white-space: nowrap;
  }
  .tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); background: #24140c; }

  .stage {
    position: relative; width: 100%; aspect-ratio: 4 / 3; touch-action: pan-y; user-select: none; -webkit-user-select: none; max-width: 100%;
    border-radius: 14px; overflow: hidden; background: #0a0605; border: 1px solid var(--line);
  }
  @media (max-width: 520px) { .stage { aspect-ratio: 4 / 4.6; } }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage .fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  .about { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; font-size: 13.5px; }
  .about dt { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 11.5px; padding-top: 2px; }
  .about dd { margin: 0; min-width: 0; }

  .controls {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  label, .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  output { font-variant-numeric: tabular-nums; color: var(--fg); font-size: 13px; }
  input[type="text"] {
    width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); padding: 0; cursor: pointer; }
  .swatches button[aria-pressed="true"] { border-color: var(--fg); }
  .swatches input[type="color"] { width: 38px; height: 34px; border: 0; padding: 0; background: none; cursor: pointer; }
  input[type="file"] { color: var(--muted); font: inherit; font-size: 13px; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 18px; }
  .opts label { display: flex; align-items: center; gap: 8px; text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--fg); }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .acts button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .check { flex-direction: row; align-items: center; gap: 10px; }
  .check label { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--fg); }
</style>

<div class="wrap">
  <header>
    <h1>Laboratório de Títulos</h1>
    <p>Um efeito por gênero, todos nascendo da cor do texto. Troque de aba para comparar.</p>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Gênero"></div>

  <div class="stage" id="stage">
    <canvas id="gl" aria-label="Texto com efeito"></canvas>
    <canvas id="embers" aria-hidden="true"></canvas>
    <div class="fallback" id="fallback" hidden>Seu navegador não conseguiu iniciar o WebGL.</div>
  </div>

  <dl class="about">
    <dt>Hoje no app</dt><dd id="a-now"></dd>
    <dt>Proposta</dt><dd id="a-idea"></dd>
    <dt>Fonte</dt><dd id="a-font"></dd>
    <dt>Margem</dt><dd id="a-pad"></dd>
    <dt>Interação</dt><dd id="a-touch"></dd>
  </dl>

  <div class="controls">
    <div class="field wide">
      <label for="txt">Texto</label>
      <input type="text" id="txt" maxlength="40" autocomplete="off">
    </div>
    <div class="field">
      <div class="row"><label for="intensity">Intensidade</label><output id="o-int"></output></div>
      <input type="range" id="intensity" min="0.4" max="2" step="0.05" value="1">
    </div>
    <div class="field">
      <div class="row"><label for="height" id="l-height">Extensão</label><output id="o-h"></output></div>
      <input type="range" id="height" min="0.3" max="1.4" step="0.05" value="0.85">
    </div>
    <div class="field">
      <div class="row"><label for="speed">Velocidade</label><output id="o-s"></output></div>
      <input type="range" id="speed" min="0.3" max="2.5" step="0.05" value="1">
    </div>
    <div class="field">
      <span class="label">Cor do texto</span>
      <div class="swatches" id="swatches" role="group" aria-label="Cor do texto">
        <input type="color" id="color" value="#ffffff" aria-label="Escolher outra cor">
      </div>
    </div>
    <div class="field wide">
      <label for="fontFile">Usar a fonte do app (.ttf ou .otf)</label>
      <input type="file" id="fontFile" accept=".ttf,.otf,.woff,.woff2,font/ttf,font/otf">
    </div>
    <div class="field wide">
      <span class="label">Limites do Compose</span>
      <div class="opts">
        <label><input type="checkbox" id="boxOn" checked> Limitar à caixa do texto</label>
        <label><input type="checkbox" id="boxSoft" checked> Suavizar a borda</label>
        <label><input type="checkbox" id="boxShow" checked> Mostrar a caixa</label>
      </div>
    </div>
    <div class="field">
      <div class="row"><label for="boxScale">Margem</label><output id="o-box"></output></div>
      <input type="range" id="boxScale" min="0" max="2" step="0.05" value="1">
    </div>
    <div class="field wide">
      <span class="label">Interação</span>
      <div class="opts">
        <label><input type="checkbox" id="touchOn" checked> Responder ao toque</label>
        <label><input type="checkbox" id="touchLock"> Travar a rolagem sobre o palco</label>
      </div>
    </div>
    <div class="field wide" id="optWrap" hidden>
      <span class="label">Camadas</span>
      <div class="opts" id="opts"></div>
    </div>
    <div class="field wide" id="actWrap" hidden>
      <div class="acts" id="acts"></div>
    </div>
    <div class="field check wide" id="embWrap">
      <input type="checkbox" id="emb" checked>
      <label for="emb">Partículas (poucas)</label>
    </div>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var glCanvas = document.getElementById('gl');
  var emCanvas = document.getElementById('embers');
  var emCtx = emCanvas.getContext('2d');
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- color helpers ----------
  function hex2rgb(h) { h = h.replace('#', ''); return [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16) / 255; }); }
  function rgb2hsl(c) {
    var r = c[0], g = c[1], b = c[2], mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, h = 0, s = 0, d = mx - mn;
    if (d > 1e-6) {
      s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function hsl(h, s, l) {
    h = ((h % 360) + 360) % 360 / 360;
    function f(n) { var k = (n + h * 12) % 12, a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); }
    return [f(0), f(8), f(4)];
  }
  function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function css(c) { return Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255); }
  var WHITE = [1, 1, 1];
  // dark brand colors (a wine red, a saddle brown) need lifting to read as text on the dark stage
  function lift(T) { var x = rgb2hsl(T); return x[2] < 0.58 ? hsl(x[0], x[1], 0.62) : T; }

  // Every palette starts from the single text color the user (or the genre) provides.
  function palFire(hex) {
    var T = lift(hex2rgb(hex)), x = rgb2hsl(T), hb = x[1] < 0.12 ? 22 : x[0], sb = Math.max(x[1], 0.75);
    var c4 = mixc(T, WHITE, 0.22), c3 = hsl(hb, sb, 0.62), c2 = hsl(hb - 16, sb, 0.5), c1 = hsl(hb - 50, sb * 0.9, 0.24);
    return { text: T, c1: c1, c2: c2, c3: c3, c4: c4, halo: mixc(hsl(hb + 170, 0.8, 0.68), c3, 0.35), spark: [css(c4), css(c3)] };
  }
  function palHorror(hex) {
    var T = lift(hex2rgb(hex)), x = rgb2hsl(T), h = x[1] < 0.06 ? 200 : x[0], sat = Math.min(0.9, Math.max(0.3, x[1] * 1.2 + 0.25));
    var c3 = hsl(h, sat, 0.42), c4 = hsl(h + 6, sat * 0.8, 0.8);
    return { text: T, c1: hsl(h, sat, 0.07), c2: hsl(h, sat, 0.22), c3: c3, c4: c4, halo: hsl(h, sat, 0.4), spark: [css(c4), css(c3)] };
  }
  function palCowboy(hex) {
    var T = lift(hex2rgb(hex)), x = rgb2hsl(T), h = x[1] < 0.12 ? 24 : x[0];
    var c2 = hsl(h - 8, 1, 0.46), c3 = hsl(h + 6, 1, 0.58), c4 = mixc(hsl(h + 14, 1, 0.82), WHITE, 0.3);
    return { text: T, c1: hsl(h - 18, 0.9, 0.2), c2: c2, c3: c3, c4: c4, halo: hsl(h - 6, 1, 0.5), spark: [css(c4), css(c3)] };
  }
  function palShinobi(hex) {
    var T = lift(hex2rgb(hex)), x = rgb2hsl(T), h = x[1] < 0.18 ? 352 : x[0];
    var c2 = mixc([0.40, 0.42, 0.48], T, 0.14), c3 = mixc([0.68, 0.70, 0.76], T, 0.16);
    return { text: T, c1: [0.1, 0.1, 0.14], c2: c2, c3: c3, c4: T, halo: hsl(h, 0.85, 0.55), spark: [css(c3), css(c2)] };
  }
  function palCrime(hex) {
    var T = lift(hex2rgb(hex)), x = rgb2hsl(T), h = x[1] < 0.12 ? 320 : x[0];
    var c1, c2, c3, c4;
    if (hex.toLowerCase() === '#e91e63') {   // the app's own gradient: pink, light pink, mint, violet
      c1 = hex2rgb('#E91E63'); c2 = hex2rgb('#FF6B9D'); c3 = hex2rgb('#7FFFEE'); c4 = hex2rgb('#9B5DE5');
    } else {
      c1 = hsl(h - 60, 1, 0.58); c2 = hsl(h, 1, 0.62); c3 = hsl(h + 45, 1, 0.66); c4 = hsl(h + 90, 0.95, 0.7);
    }
    return { text: T, c1: c1, c2: c2, c3: c3, c4: c4, halo: c2, spark: [css(c4), css(c3)] };
  }
  function palHeroes(hex) {
    var T = hex2rgb(hex), x = rgb2hsl(T), h = x[0];
    if (hex.toLowerCase() === '#2845d6') {   // the app's own palette: navy, blue, cyan, ice, gold
      return { text: T, c1: hex2rgb('#0D1A63'), c2: hex2rgb('#4169F5'), c3: hex2rgb('#00D9FF'), c4: hex2rgb('#E6E9FF'), halo: hex2rgb('#FDC500'), spark: ['230,233,255', '0,217,255'] };
    }
    var c3 = hsl(h - 36, 1, 0.55), c4 = mixc(hsl(h, 0.9, 0.9), WHITE, 0.4);
    return { text: T, c1: hsl(h, 0.8, 0.16), c2: hsl(h, 0.9, 0.58), c3: c3, c4: c4, halo: hsl(h + 180, 1, 0.5), spark: [css(c4), css(c3)] };
  }

  // ---------- shaders ----------
  var VS = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0., 1.); }';
  var COMMON = `
precision highp float;
uniform sampler2D uMask, uS;
uniform float uTime, uIntensity, uHeight, uTextY, uTextH;
uniform vec2 uRes;
uniform vec3 uC1, uC2, uC3, uC4, uHalo, uText, uOpt;
uniform float uEvtA, uEvtB, uSeedB, uSeedA;
uniform vec4 uBox, uFw;
uniform vec4 uTrail[8];
uniform vec2 uTrailV[8];
uniform vec4 uPtr;
uniform vec4 uCut;
// recent finger positions with a fading strength; returns (influence, weighted velocity x, y)
vec3 trailField(vec2 uv, float asp, float rad){
  vec3 acc = vec3(0.);
  for (int i = 0; i < 8; i++){
    vec2 d = (uv - uTrail[i].xy) * vec2(asp, 1.);
    float g = exp(-dot(d, d) / (rad * rad)) * uTrail[i].z;
    acc.x += g; acc.yz += uTrailV[i] * g;
  }
  return acc;
}
uniform vec2 uBoxCfg;
varying vec2 vUv;
// Simulates the bounds a Compose layout gives the title: nothing may show outside the box.
// With the soft edge on, every effect fades to the background over the margin instead of being cut.
vec3 boxed(vec3 c, vec2 uv){
  if (uBoxCfg.x < .5) return c;
  vec2 px = uv * uRes, lo = uBox.xy * uRes, hi = uBox.zw * uRes;
  float soft = uBoxCfg.y;
  float fx = max(soft > .5 ? uFw.x : 1., 1.), ft = max(soft > .5 ? uFw.y : 1., 1.), fb = max(soft > .5 ? uFw.z : 1., 1.);
  float m = smoothstep(lo.x, lo.x + fx, px.x) * (1. - smoothstep(hi.x - fx, hi.x, px.x));
  m *= smoothstep(lo.y, lo.y + fb, px.y) * (1. - smoothstep(hi.y - ft, hi.y, px.y));
  vec3 o = mix(vec3(.039, .024, .020), c, m);
  vec2 d = min(px - lo, hi - px);
  float e = min(d.x, d.y);
  o = mix(o, vec3(.35, .75, 1.), (1. - smoothstep(0., 1.6, abs(e))) * .7 * step(-1.6, e) * step(.5, uFw.w));
  return o;
}
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  float a = hash(i), b = hash(i + vec2(1., 0.)), c = hash(i + vec2(0., 1.)), d = hash(i + vec2(1., 1.));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y); }
float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 4; i++){ v += a * noise(p); p = p * 2.03 + vec2(7.1, 3.7); a *= .5; } return v; }
`;

  var FS_FIRE = COMMON + `
void main(){
  vec2 uv = vUv; float asp = uRes.x / uRes.y;
  float dy = uv.y - uTextY;
  float up = smoothstep(-.02, .25, dy);
  float sc = uHeight / 0.85;
  vec2 q = vec2(uv.x * asp * 2.2, uv.y * 1.4 - uTime * .5);
  float nx = fbm(q) - .5;
  float ny = fbm(q * 1.5 + vec2(3.1, -uTime * .4)) - .5;
  vec3 tf = trailField(uv, asp, .16);
  vec2 su = vec2(uv.x + nx * .10 * up - clamp(tf.y * .05, -.08, .08), uTextY + max(dy, 0.) / sc + min(dy, 0.) + ny * .05 * up - tf.x * .04);
  vec4 S = texture2D(uS, su);
  float xs = uv.x * asp + nx * .35 * up;
  float s1 = noise(vec2(xs * 16., uv.y * .8 - uTime * .45));
  float s2 = noise(vec2(xs * 40. + 9., uv.y * 1.4 - uTime * .8));
  float streak = smoothstep(.22, .78, .6 * s1 + .4 * s2);
  float h = clamp(pow(S.r, .8) * (.22 + 1.0 * streak) * uIntensity * (1. + tf.x * .9), 0., 1.4);
  vec3 col = mix(uC1, uC2, smoothstep(.12, .45, h));
  col = mix(col, uC3, smoothstep(.42, .80, h));
  col = mix(col, uC4, smoothstep(.78, 1.1, h));
  float alpha = smoothstep(.03, .24, h);
  vec3 bg = vec3(.039, .024, .020);
  vec3 outc = bg + uC2 * S.g * .42 * uIntensity;
  outc = mix(outc, col, alpha);
  outc += uHalo * S.b * .55 * uIntensity;
  float m0 = texture2D(uMask, uv).r;
  float g = clamp((uv.y - (uTextY - uTextH * .5)) / uTextH, 0., 1.);
  m0 *= 1. - smoothstep(.6, 1., g) * .7 * (1. - smoothstep(.15, .75, streak + .12));
  vec3 tw = mix(uText, vec3(1.), .62);
  vec3 tcol = mix(mix(tw, uHalo, .18), tw, g);
  outc = mix(outc, tcol, m0);
  outc += (hash(uv * uRes + fract(uTime) * 91.7) - .5) * .07;
  gl_FragColor = vec4(boxed(outc, uv), 1.);
}`;

  var FS_HORROR = COMMON + `
void main(){
  vec2 uv = vUv; float asp = uRes.x / uRes.y; float t = uTime;
  float bot = uTextY - uTextH * .5;
  float g = clamp((uv.y - bot) / uTextH, 0., 1.);

  // possession glitch: short bursts where a torn band slides sideways and the channels split
  float tick = floor(t * 7.);
  float gl = step(.9, hash(vec2(tick, 1.3))) * uOpt.y;
  float yc = bot + hash(vec2(tick, 2.7)) * uTextH;
  float bh = uTextH * (.2 + .5 * hash(vec2(tick, 4.1)));
  float inBand = gl * (1. - smoothstep(bh, bh * 1.5, abs(uv.y - yc)));
  float tear = (hash(vec2(tick, 5.5)) - .5) * .10 * inBand;
  // magnifying lens that follows the finger
  vec2 pp = uPtr.xy; float act = uPtr.w;
  vec2 dl = (uv - pp) * vec2(asp, 1.);
  float kl = (1. - smoothstep(0., .17, length(dl))) * act;
  vec2 uvm = pp + (uv - pp) * (1. - .55 * kl);
  float w1 = fbm(vec2(uv.x * asp * 3., uv.y * 3. + t * .15)) - .5;
  vec2 mu = uvm + vec2(tear + w1 * .004, 0.);
  float cs = .006 * gl + .004 * kl;
  float mR = texture2D(uMask, mu + vec2(cs, 0.)).r;
  float mB = texture2D(uMask, mu - vec2(cs, 0.)).r;
  float m0 = texture2D(uMask, mu).r;
  vec2 go = vec2(.008, -.006) * (.6 + .8 * (sin(t * .9) * .5 + .5));
  float gh = texture2D(uMask, mu - go).r;
  float blink = 1. - gl * .7 * step(.5, hash(vec2(tick, 9.1)));
  float fl = .93 + .07 * noise(vec2(t * 14., 2.));
  vec4 S = texture2D(uS, uv);

  // cold light from above, ground fog crawling sideways, breath rising off the letters
  float cone = max(1. - length((uv - vec2(.5, 1.15)) * vec2(asp * .8, .9)), 0.);
  vec3 bg = vec3(.004, .008, .016) + uC2 * .5 * cone * cone;
  float f1 = fbm(vec2(uv.x * asp * 2.0 + t * .10, uv.y * 3.5 + t * .02));
  float f2 = fbm(vec2(uv.x * asp * 3.4 - t * .17, uv.y * 5. + 7.));
  float ground = 1. - smoothstep(bot - uTextH * .6, uTextY + uTextH * 2. * (uHeight / .85), uv.y);
  float dens = smoothstep(.25, .9, f1 * .65 + f2 * .55) * ground * uOpt.x * (1. - kl * .85);
  float sc = uHeight / .85;
  float dyC = uv.y - uTextY;
  vec2 q = vec2(uv.x * asp * 2.4, uv.y * 1.6 - t * .35);
  float nx = fbm(q) - .5;
  vec2 su = vec2(uv.x + nx * .09, uTextY + max(dyC, 0.) / sc + min(dyC, 0.));
  vec4 Sw = texture2D(uS, su);
  float s1 = noise(vec2((uv.x * asp + nx * .3) * 18., uv.y * .8 - t * .4));
  float hb = pow(Sw.r, .9) * (.15 + .85 * smoothstep(.25, .8, s1)) * .6;
  float wa = smoothstep(.05, .5, hb) * .38 * uOpt.x;

  vec3 outc = bg + uC2 * S.g * .22;
  outc = mix(outc, mix(uC2, uC3, .35) * .9, dens * .55);
  outc = mix(outc, mix(uC2, uC4, hb), wa);

      b.type = 'button'; b.dataset.c = sw[1]; b.title = sw[0]; b.setAttribute('aria-label', sw[0]);
      b.style.background = sw[1];
      b.addEventListener('click', function () { setColor(sw[1]); });
      swWrap.insertBefore(b, colorIn);
    });
    markSwatches();
  }

  function setTab(id) {
    cur = id; sparks.length = 0;
    var cfg = TABS[id], s = st[id];
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.setAttribute('aria-selected', b.dataset.id === id ? 'true' : 'false'); });
    txtIn.value = s.text;
    rInt.value = s.intensity; rH.value = s.height; rS.value = s.speed;
    document.getElementById('l-height').textContent = cfg.hLabel;
    document.getElementById('a-now').textContent = cfg.now;
    document.getElementById('a-idea').textContent = cfg.idea;
    document.getElementById('a-touch').textContent = cfg.touch;
    var pdn = cfg.pad, f1 = function (v) { return String(v).replace('.', ',') + '×'; };
    document.getElementById('a-pad').textContent = 'Recomendada (1×): topo ' + f1(pdn.t) + ', base ' + f1(pdn.b) + ', lados ' + f1(pdn.s) + ' da altura do texto.';
    document.getElementById('a-font').textContent = cfg.custom ? 'Arquivo carregado por você.' : cfg.font;
    fontIn.value = '';
    embWrap.hidden = !cfg.embers;
    var optsEl = document.getElementById('opts'), actsEl = document.getElementById('acts');
    optsEl.textContent = ''; actsEl.textContent = '';
    document.getElementById('optWrap').hidden = !cfg.opts;
    document.getElementById('actWrap').hidden = !cfg.actions;
    (cfg.opts || []).forEach(function (o, i) {
      var l = document.createElement('label'), c = document.createElement('input');
      c.type = 'checkbox'; c.checked = s.opts[i]; c.id = 'opt-' + id + '-' + i;
      c.addEventListener('change', function () { s.opts[i] = c.checked; });
      l.appendChild(c); l.appendChild(document.createTextNode(o[0])); optsEl.appendChild(l);
    });
    (cfg.actions || []).forEach(function (a) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = a[0];
      b.addEventListener('click', function () { if (a[1] === 'a') { ev.la = t; ev.seedA++; ev.cut.user = false; } else { ev.lb = t; ev.seed++; } });
      actsEl.appendChild(b);
    });
    ev.la = t; ev.lb = t - 0.3;
    buildSwatches(); showVals();
    if (W) buildMask();
    if (document.fonts && document.fonts.load) {
      document.fonts.load(cfg.weight + ' 64px "' + cfg.family + '"', s.text).then(function () { if (cur === id && W) buildMask(); }, function () {});
    }
  }

  ORDER.forEach(function (id) {
    var b = document.createElement('button');
    b.type = 'button'; b.dataset.id = id; b.textContent = TABS[id].label;
    b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', 'false');
    b.addEventListener('click', function () { setTab(id); });
    tabsEl.appendChild(b);
  });
  rInt.addEventListener('input', function () { st[cur].intensity = parseFloat(rInt.value); showVals(); });
  rH.addEventListener('input', function () { st[cur].height = parseFloat(rH.value); showVals(); });
  rS.addEventListener('input', function () { st[cur].speed = parseFloat(rS.value); showVals(); });
  function showBox() { document.getElementById('o-box').textContent = box.scale.toFixed(2) + '×'; }
  document.getElementById('boxOn').addEventListener('change', function (e) { box.on = e.target.checked; });
  document.getElementById('boxSoft').addEventListener('change', function (e) { box.soft = e.target.checked; });
  document.getElementById('boxShow').addEventListener('change', function (e) { box.show = e.target.checked; });
  document.getElementById('boxScale').addEventListener('input', function (e) { box.scale = parseFloat(e.target.value); showBox(); });
  showBox();
  txtIn.addEventListener('input', function (e) { st[cur].text = e.target.value; if (W) buildMask(); });
  embIn.addEventListener('change', function (e) { embersOn = e.target.checked; });
  fontIn.addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var id = cur, r = new FileReader();
    r.onload = function () {
      var name = 'appfont-' + id, ff = new FontFace(name, r.result);
      ff.load().then(function (loaded) {
        document.fonts.add(loaded);
        var c = TABS[id];
        if (!c.baseStack) c.baseStack = c.stack;
        c.family = name; c.stack = '"' + name + '", ' + c.baseStack; c.weight = 400; c.custom = true;
        if (cur === id) { document.getElementById('a-font').textContent = 'Arquivo carregado por você.'; if (W) buildMask(); }
      }, function () { document.getElementById('a-font').textContent = 'Não consegui ler esse arquivo de fonte.'; });
    };
    r.readAsArrayBuffer(f);
  });
  colorIn.addEventListener('input', function (e) { setColor(e.target.value, true); });

  // ---------- pointer input ----------
  function toUv(e) { var r = stage.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, 1 - (e.clientY - r.top) / r.height]; }
  function pushTrail(x, y, vx, vy) { inp.trail.unshift({ x: x, y: y, vx: vx, vy: vy, s: 1 }); if (inp.trail.length > 8) inp.trail.pop(); }
  stage.addEventListener('pointerdown', function (e) {
    if (!inp.on) return;
    var p = toUv(e), cfg = TABS[cur];
    inp.down = true; inp.x = p[0]; inp.y = p[1]; inp.start = p.slice(); inp.fired = false;
    inp.lastT = performance.now(); inp.lastX = p[0]; inp.lastY = p[1];
    pushTrail(p[0], p[1], 0, 0);
    if (cfg.tapEvt) ev.lb = t;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener('pointermove', function (e) {
    if (!inp.on) return;
    var p = toUv(e), cfg = TABS[cur], now = performance.now();
    var dt2 = Math.max(0.008, (now - inp.lastT) / 1000);
    inp.vx = inp.vx * 0.5 + ((p[0] - inp.lastX) / dt2) * 0.5; inp.vy = inp.vy * 0.5 + ((p[1] - inp.lastY) / dt2) * 0.5;
    inp.lastT = now; inp.lastX = p[0]; inp.lastY = p[1]; inp.x = p[0]; inp.y = p[1];
    if (e.pointerType === 'mouse' && !inp.down) inp.hover = true;
    if (inp.down || e.pointerType === 'mouse') {
      var h = inp.trail[0];
      if (!h || Math.hypot(p[0] - h.x, p[1] - h.y) > 0.025) pushTrail(p[0], p[1], inp.vx, inp.vy);
      else { h.x = p[0]; h.y = p[1]; h.vx = inp.vx; h.vy = inp.vy; h.s = 1; }
    }
    // shinobi: a quick drag across the text becomes the cut, in the direction of the gesture
    if (inp.down && cfg.dragCut && st[cur].opts[1] && !inp.fired && inp.start) {
      var asp = W / Hh, bp = boxPx(cfg);
      var sx = inp.start[0] * W, sy = (1 - inp.start[1]) * Hh;
      var inside = sx > bp.x0 && sx < bp.x1 && sy > bp.yT && sy < bp.yB;
      var dx = (p[0] - inp.start[0]) * asp, dy = p[1] - inp.start[1];
      var len = Math.hypot(dx, dy), textW = (tb.maxX - tb.minX) / Hh;
      if (inside && len > 0.3 * textW && Math.abs(dy) < 1.4 * Math.abs(dx)) {
        ev.cut = { x: (p[0] + inp.start[0]) / 2, y: (p[1] + inp.start[1]) / 2, ang: Math.atan2(dy, dx), user: true };
        ev.la = t; ev.seedA++; inp.fired = true;
        try { if (navigator.vibrate) navigator.vibrate([10, 25, 16]); } catch (_) {}
      }
    }
  });
  function release(e) { inp.down = false; if (e.pointerType !== 'mouse') inp.hover = false; }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('pointerleave', function (e) { inp.hover = false; if (e.pointerType === 'mouse') inp.down = false; });
  document.getElementById('touchOn').addEventListener('change', function (e) { inp.on = e.target.checked; if (!inp.on) { inp.down = false; inp.hover = false; inp.trail.length = 0; } });
  document.getElementById('touchLock').addEventListener('change', function (e) { stage.style.touchAction = e.target.checked ? 'none' : 'pan-y'; });

  new ResizeObserver(resize).observe(stage);
  setTab('fantasy');
  resize();
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { if (W) buildMask(); });
  }
})();
</script>
