name: CI

on:
  pull_request:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Catches Kotlin/Compose compile errors without packaging an APK.
      - name: Compile debug
        run: ./gradlew :app:compileDebugKotlin --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Informational for now: the base branch already has ~80 lint errors. Make it blocking
      # (remove continue-on-error) once they are fixed or captured in a lint baseline.
      - name: Android lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
